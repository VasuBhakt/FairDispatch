version: "3.8"

services:
  localstack:
    image: localstack/localstack:3.5.0
    ports:
      - "4566:4566"
    environment:
      - DEFAULT_REGION=us-east-1

  setup:
    build: .
    command: ["/bin/setup"]
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  api:
    build: .
    command: ["/bin/api"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["/bin/worker"]
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      setup:
        condition: service_completed_successfully
